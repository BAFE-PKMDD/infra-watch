name: infra-watch

services:
  app:
    container_name: infra-watch
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_MINIO_ENDPOINT: ${NEXT_PUBLIC_MINIO_ENDPOINT}
        NEXT_PUBLIC_MINIO_BUCKET: ${NEXT_PUBLIC_MINIO_BUCKET}
        NEXT_PUBLIC_MINIO_USE_SSL: ${NEXT_PUBLIC_MINIO_USE_SSL}
        NEXT_PUBLIC_GEOSERVER_URL: ${NEXT_PUBLIC_GEOSERVER_URL:-https://geoserver.bafe.gov.ph/geoserver}
        NEXT_PUBLIC_GEOSERVER_WORKSPACE: ${NEXT_PUBLIC_GEOSERVER_WORKSPACE:-geoagri}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3101}:3000"
    restart: unless-stopped
    init: true
    networks:
      - production

  cache:
    image: redis:7.4-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - production

volumes:
  redis-data:

networks:
  production:
    external: true
    name: ${DOCKER_NETWORK:-fmr-watch-network}
